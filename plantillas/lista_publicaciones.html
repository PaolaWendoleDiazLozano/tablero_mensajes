<!-- templates/lista_publicaciones.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tablero de mensajes</title>
</head>
<body>
  <h1>Pagina Inicial Tablero de Mensajes</h1>

  <p>Total de mensajes: {{ publicaciones|length }}</p>

  <ul>
    {% for pub in publicaciones %}
      <li>
        <strong>{{ pub.autor }}</strong> ({{ pub.fecha|date:"d/m/Y H:i" }}): {{ pub.texto }}
      </li>
    {% empty %}
      <li>Todavía no hay mensajes.</li>
    {% endfor %}
  </ul>
</body>
</html>
